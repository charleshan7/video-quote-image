name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core rsync
      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Environment doctor
        run: python scripts/doctor.py --mode maintain
      - name: Static checks
        run: |
          python scripts/validate_skill.py .
          python -m compileall -q scripts tests
          ruff check scripts tests
          for file in schemas/*.json templates/*.json; do python -m json.tool "$file" >/dev/null; done
      - name: Unit tests
        run: python -m unittest discover -s tests -v
